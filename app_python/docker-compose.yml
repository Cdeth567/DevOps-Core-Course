services:
  devops-info-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-info-service
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      DEBUG: "False"
      VISITS_FILE: /data/visits
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    restart: unless-stopped
