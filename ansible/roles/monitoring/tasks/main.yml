---
- name: Create monitoring directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ monitoring_dir }}"
    - "{{ monitoring_dir }}/loki"
    - "{{ monitoring_dir }}/promtail"
    - "{{ monitoring_dir }}/prometheus"
    - "{{ monitoring_dir }}/grafana"
    - "{{ monitoring_dir }}/grafana/dashboards"
    - "{{ monitoring_dir }}/grafana/provisioning"
    - "{{ monitoring_dir }}/grafana/provisioning/datasources"
    - "{{ monitoring_dir }}/grafana/provisioning/dashboards"

- name: Template docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_dir }}/docker-compose.yml"
    mode: "0644"

- name: Template Prometheus config
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
    mode: "0644"

- name: Copy Loki config
  ansible.builtin.copy:
    src: loki-config.yml
    dest: "{{ monitoring_dir }}/loki/config.yml"
    mode: "0644"

- name: Copy Promtail config
  ansible.builtin.copy:
    src: promtail-config.yml
    dest: "{{ monitoring_dir }}/promtail/config.yml"
    mode: "0644"

- name: Copy Grafana datasources provisioning
  ansible.builtin.copy:
    src: grafana-datasources.yml
    dest: "{{ monitoring_dir }}/grafana/provisioning/datasources/datasources.yml"
    mode: "0644"

- name: Copy Grafana dashboard provider
  ansible.builtin.copy:
    src: grafana-dashboard-provider.yml
    dest: "{{ monitoring_dir }}/grafana/provisioning/dashboards/dashboard.yml"
    mode: "0644"

- name: Copy Grafana dashboards
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ monitoring_dir }}/grafana/dashboards/{{ item.dest }}"
    mode: "0644"
  loop:
    - src: grafana-app-dashboard.json
      dest: lab08-metrics-dashboard.json
    - src: grafana-logs-dashboard.json
      dest: lab07-observability.json

- name: Deploy monitoring stack
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    state: present
    pull: policy
    recreate: auto

- name: Wait for Grafana health
  ansible.builtin.uri:
    url: http://localhost:3000/api/health
    method: GET
    status_code: 200
  register: grafana_health
  retries: 20
  delay: 5
  until: grafana_health.status == 200

- name: Wait for Prometheus health
  ansible.builtin.uri:
    url: http://localhost:9090/-/healthy
    method: GET
    status_code: 200
  register: prometheus_health
  retries: 20
  delay: 5
  until: prometheus_health.status == 200

- name: Wait for application health
  ansible.builtin.uri:
    url: "http://localhost:{{ monitoring_app_port }}{{ monitoring_app_health_endpoint }}"
    method: GET
    status_code: 200
  register: app_health
  retries: 20
  delay: 5
  until: app_health.status == 200
