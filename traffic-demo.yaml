apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-demo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-demo
  template:
    metadata:
      labels:
        app: traffic-demo
    spec:
      containers:
        - name: traffic-demo
          image: busybox:1.36
          command:
            - sh
            - -c
            - while true; do wget -q -O- http://monitoring-grafana.monitoring.svc.cluster.local > /dev/null; sleep 1; done
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
