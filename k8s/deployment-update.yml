apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-info-service
  namespace: devops-lab09
  labels:
    app.kubernetes.io/name: devops-info-service
    app.kubernetes.io/instance: devops-info-service
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: devops-core-course
    app.kubernetes.io/version: 1.1.0-k8s
spec:
  replicas: 3
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-info-service
      app.kubernetes.io/instance: devops-info-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-info-service
        app.kubernetes.io/instance: devops-info-service
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: devops-core-course
        app.kubernetes.io/version: 1.1.0-k8s
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: devops-info-service
          image: cdeth567/devops-info-service:lab09
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "5000"
            - name: SERVICE_NAME
              value: "devops-info-service"
            - name: SERVICE_VERSION
              value: "1.1.0-k8s"
            - name: SERVICE_DESCRIPTION
              value: "DevOps course info service on Kubernetes (updated rollout)"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
