# Default values for devops-info-service.
# This chart packages the DevOps Info Service with support for Argo Rollouts.

nameOverride: ""
fullnameOverride: ""

replicaCount: 3
revisionHistoryLimit: 10
partOf: devops-core-course
component: web

automountServiceAccountToken: false
terminationGracePeriodSeconds: 30

environment: dev
logLevel: INFO

featureFlags:
  visitsCounter: true
  prometheusMetrics: true
  readinessProbe: true

config:
  mountPath: /config
  fileName: config.json

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 100Mi
  storageClass: ""
  mountPath: /data

image:
  repository: cdeth567/devops-info-service
  tag: lab12
  pullPolicy: IfNotPresent

container:
  port: 5000

service:
  type: ClusterIP
  port: 80
  targetPort: http
  nodePort: null

serviceAccount:
  create: true
  name: ""
  automount: true

secret:
  enabled: true
  nameOverride: ""
  type: Opaque
  envFrom: true
  data:
    username: "change-me"
    password: "change-me"

vault:
  enabled: false
  role: devops-info-service
  secretPath: secret/data/myapp/config
  injectFileName: app-config

appConfig:
  host: 0.0.0.0
  debug: "False"
  serviceVersion: "1.0.0-lab14"
  serviceDescription: "DevOps course info service with progressive delivery"

rollout:
  enabled: true
  strategy: canary
  progressDeadlineSeconds: 600
  restartAt: ""
  canary:
    maxSurge: 1
    maxUnavailable: 0
    steps:
      - setWeight: 20
      - pause: {}
      - setWeight: 40
      - pause:
          duration: 30s
      - setWeight: 60
      - pause:
          duration: 30s
      - setWeight: 80
      - pause:
          duration: 30s
      - setWeight: 100
  blueGreen:
    autoPromotionEnabled: false
    autoPromotionSeconds: 0
    scaleDownDelaySeconds: 30

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

startupProbe:
  httpGet:
    path: /ready
    port: http
  periodSeconds: 5
  failureThreshold: 12

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

hooks:
  image:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
  preInstall:
    enabled: true
    weight: "-5"
  postInstall:
    enabled: true
    weight: "5"
    maxAttempts: 30
    sleepSeconds: 2
