replicaCount: 1

service:
  type: NodePort
  port: 80
  targetPort: http
  nodePort: 30080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

readinessProbe:
  initialDelaySeconds: 2
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3
  httpGet:
    path: /ready
    port: http

livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
  httpGet:
    path: /health
    port: http

appConfig:
  serviceVersion: "1.0.0-dev"
  serviceDescription: "Development profile for DevOps Info Service"
